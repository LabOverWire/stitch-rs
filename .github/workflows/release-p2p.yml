name: Release p2p

on:
  push:
    tags: ["stitch-p2p-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. stitch-p2p-v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish mqp2p and stitch-p2p to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches stitch-p2p version
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          TAG="${REF#stitch-p2p-v}"
          P2P_VERSION=$(grep '^version' crates/stitch-p2p/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$P2P_VERSION" ]; then
            echo "Tag stitch-p2p-v$TAG does not match stitch-p2p version $P2P_VERSION"
            exit 1
          fi

      - name: Publish mqp2p
        run: cargo publish --package mqp2p || echo "already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish stitch-p2p
        run: cargo publish --package stitch-p2p || echo "already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
