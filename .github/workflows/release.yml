name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish both library crates to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate versions
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          TAG="${REF#v}"
          SYNC_VERSION=$(grep '^version' crates/stitch/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          WASM_VERSION=$(grep '^version' crates/stitch-wasm/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$SYNC_VERSION" ]; then
            echo "Tag v$TAG does not match stitch-sync version $SYNC_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$WASM_VERSION" ]; then
            echo "Tag v$TAG does not match stitch-wasm version $WASM_VERSION"
            exit 1
          fi

      - name: Publish stitch-sync
        run: cargo publish --package stitch-sync || echo "already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish stitch-wasm
        run: cargo publish --package stitch-wasm --no-verify || echo "already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish the wasm bindings to npm via OIDC trusted publishing (no token)
  publish-npm:
    name: Publish @laboverwire/stitch-wasm to npm
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build scoped package
        run: wasm-pack build --scope laboverwire crates/stitch-wasm

      - name: Publish if the version is new
        working-directory: crates/stitch-wasm/pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@laboverwire/stitch-wasm@$VERSION" version >/dev/null 2>&1; then
            echo "@laboverwire/stitch-wasm@$VERSION already published"
          else
            npm publish --access public
          fi

  # Create GitHub release
  create-release:
    name: Create GitHub Release
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
